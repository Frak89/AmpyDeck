name: Build AmpyDeck APK
on:
  workflow_dispatch:
  push:
    branches: [ main, "ampydeck-*" ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager missing"; exit 1; fi
          (yes | "$SDKMANAGER" --licenses >/dev/null) || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Optional stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AMPYDECK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AMPYDECK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMPYDECK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMPYDECK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ampydeck.jks"
            echo "AMPYDECK_KEYSTORE_PATH=$RUNNER_TEMP/ampydeck.jks" >> "$GITHUB_ENV"
            echo "AMPYDECK_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AMPYDECK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AMPYDECK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable signing key loaded"
          else
            echo "No signing secrets: using the debug key"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|ERROR:|What went wrong|\.java:[0-9]+|\.xml" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AmpyDeck.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmpyDeck-APK
          path: out/AmpyDeck.apk
          if-no-files-found: error
      - name: Publish rolling release (download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/AmpyDeck.apk \
            --title "AmpyDeck — ultima build" \
            --notes "APK compilato automaticamente dal commit ${GITHUB_SHA::7}. Scarica AmpyDeck.apk e installalo." \
            --prerelease
